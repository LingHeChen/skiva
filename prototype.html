<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skiva — Developer workspace</title>
    <style>
      :root {
        --bg: #fafbf8;
        --surface: #fff;
        --side: #f1f3eb;
        --line: #dfe3d8;
        --subtle: #f5f7f1;
        --ink: #242b20;
        --muted: #66705e;
        --olive: #52663a;
        --soft: #e9efde;
        --amber: #8f6429;
        --red: #a63c36;
        --mono: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
        --focus: #718b51;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.55 "Avenir Next",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a {
        cursor: pointer;
      }
      button {
        border: 0;
        background: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:not(:disabled):active {
        filter: brightness(0.94);
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 25px;
        letter-spacing: -0.8px;
        font-weight: 600;
      }
      h2 {
        font-size: 15px;
        font-weight: 600;
      }
      h3 {
        font-size: 13px;
      }
      svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      code,
      kbd,
      .mono {
        font: 12px/1.6 var(--mono);
      }
      kbd {
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 4px;
        color: var(--muted);
        font-size: 10px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid #cfd6c6;
        background: var(--surface);
        border-radius: 5px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 550;
        min-height: 34px;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--subtle);
        border-color: #a6b296;
      }
      .btn.primary {
        background: var(--olive);
        border-color: var(--olive);
        color: white;
      }
      .btn.primary:hover {
        background: #42572e;
      }
      .btn.dark {
        background: #283322;
        color: #fff;
        border-color: #283322;
      }
      .btn.danger {
        color: var(--red);
        border-color: #d8b5af;
      }
      .iconbtn {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 4px;
      }
      .iconbtn:hover {
        background: var(--soft);
      }
      .link {
        color: var(--olive);
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .link:hover {
        text-decoration: underline;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 4px;
        padding: 2px 6px;
        background: var(--soft);
        color: #425b2c;
        font-size: 11px;
        white-space: nowrap;
      }
      .pill.amber {
        background: #f8efdf;
        color: var(--amber);
      }
      .pill.gray {
        background: #eef0eb;
        color: #626d58;
      }
      .pill.red {
        background: #f9eae7;
        color: var(--red);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .tag {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
        font: 11px var(--mono);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #e0dccc;
        color: #655a43;
        font-size: 10px;
        font-weight: 600;
      }
      .top {
        height: 58px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        position: fixed;
        inset: 0 0 auto;
        z-index: 25;
        display: flex;
        align-items: center;
        padding: 0 21px;
        gap: 24px;
      }
      .brand {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -1px;
        width: 168px;
      }
      .brandmark {
        width: 27px;
        height: 29px;
        border-radius: 5px;
        background: var(--olive);
        color: white;
        display: grid;
        place-items: center;
      }
      .brandmark svg {
        width: 20px;
        height: 20px;
      }
      .slash {
        color: #b2baaa;
        font-size: 22px;
        font-weight: 300;
      }
      .workspace-name {
        font-size: 12px;
        font-weight: 550;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .toptools {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .cmdtrigger {
        border: 1px solid var(--line);
        border-radius: 5px;
        display: flex;
        align-items: center;
        gap: 9px;
        width: 210px;
        height: 32px;
        color: var(--muted);
        font-size: 12px;
        padding: 0 9px;
      }
      .cmdtrigger kbd {
        margin-left: auto;
      }
      .demo {
        font-size: 10px;
        letter-spacing: 0.5px;
        color: #796c4e;
        background: #f6f2e5;
        border: 1px solid #e7deca;
        border-radius: 3px;
        padding: 2px 6px;
      }
      .sidebar {
        position: fixed;
        inset: 58px auto 0 0;
        width: 210px;
        padding: 20px 12px 10px;
        border-right: 1px solid var(--line);
        background: var(--side);
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .navlabel {
        padding: 12px 10px 6px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1px;
      }
      .nav {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        min-height: 35px;
        color: #56624b;
        border-radius: 5px;
        margin-bottom: 3px;
        font-size: 12px;
      }
      .nav:hover {
        background: #e6ebdd;
      }
      .nav.active {
        background: #e0e8d3;
        color: #344c22;
        font-weight: 600;
        box-shadow: inset 2px 0 #607544;
      }
      .nav .count {
        margin-left: auto;
        font: 10px var(--mono);
        padding: 0 5px;
        border: 1px solid #d5ddc8;
        border-radius: 3px;
      }
      .repo-nav {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: -0.3px;
      }
      .side-bottom {
        margin-top: auto;
        border-top: 1px solid #dae0d0;
        padding-top: 12px;
      }
      .side-note {
        padding: 12px 10px;
        font-size: 11px;
        color: var(--muted);
      }
      .main {
        margin: 58px 0 0 210px;
        min-height: calc(100vh - 58px);
      }
      .pagehead {
        padding: 27px 30px 0;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .eyebrow {
        font: 11px var(--mono);
        color: var(--muted);
        margin-bottom: 12px;
      }
      .repo-logo {
        width: 40px;
        height: 40px;
        border: 1px solid #d7dfca;
        background: #eef3e5;
        color: var(--olive);
        display: grid;
        place-items: center;
        border-radius: 7px;
      }
      .repo-logo svg {
        width: 23px;
        height: 23px;
      }
      .projectdesc {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .titleline {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .tabs {
        display: flex;
        gap: 24px;
        margin-top: 22px;
        overflow: auto;
        scrollbar-width: thin;
      }
      .tab {
        padding: 11px 2px 13px;
        display: flex;
        align-items: center;
        gap: 7px;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        white-space: nowrap;
        font-size: 12px;
      }
      .tab.active {
        color: #384c26;
        border-color: var(--olive);
        font-weight: 600;
      }
      .tab .num {
        font: 10px var(--mono);
        background: #eff2e9;
        padding: 0 5px;
        border-radius: 4px;
      }
      .body {
        padding: 24px 30px 30px;
        max-width: 1700px;
        margin: auto;
      }
      .notice {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border: 1px solid #d7e0c9;
        border-radius: 5px;
        background: #f0f5e8;
        font-size: 12px;
        margin-bottom: 20px;
        color: #4f613b;
      }
      .notice .link {
        margin-left: auto;
        white-space: nowrap;
      }
      .notice.amber {
        background: #fcf5e8;
        border-color: #eadcc0;
        color: #86612a;
      }
      .workgrid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 232px;
        gap: 24px;
      }
      .box {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .toolbar .right {
        margin-left: auto;
        display: flex;
        gap: 7px;
      }
      .inputwrap {
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--surface);
        padding: 6px 9px;
        min-height: 34px;
      }
      .inputwrap input {
        background: none;
        border: 0;
        outline: none;
        min-width: 0;
        width: 165px;
        font-size: 12px;
      }
      .commitbar {
        padding: 11px 13px;
        background: #f5f8ee;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .commitbar .message {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .commitbar code {
        color: var(--olive);
      }
      .filebrowser {
        display: grid;
        grid-template-columns: 205px minmax(0, 1fr);
        min-height: 440px;
      }
      .tree {
        border-right: 1px solid var(--line);
        background: #fbfcf8;
        padding: 12px 7px;
      }
      .treehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
        padding: 1px 8px 11px;
      }
      .folder {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 7px;
        color: #5c6852;
        font-size: 12px;
      }
      .file {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 7px 8px 7px 25px;
        width: 100%;
        text-align: left;
        border-radius: 4px;
        font: 11px var(--mono);
        white-space: nowrap;
      }
      .file:hover {
        background: #eef2e7;
      }
      .file.active {
        background: #e4ecd9;
        color: #405a2a;
        box-shadow: inset 2px 0 var(--olive);
      }
      .file.sub {
        padding-left: 38px;
      }
      .file.root {
        padding-left: 8px;
      }
      .file .changed {
        margin-left: auto;
        color: #9b753c;
        font-size: 10px;
      }
      .filepane {
        min-width: 0;
      }
      .filehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 13px;
        border-bottom: 1px solid var(--line);
        font: 11px var(--mono);
      }
      .segment {
        display: inline-flex;
        align-items: center;
        background: #eff2e9;
        border: 1px solid #e2e6da;
        border-radius: 4px;
        padding: 2px;
      }
      .segment button {
        padding: 3px 8px;
        font-size: 11px;
        white-space: nowrap;
        border-radius: 3px;
        color: var(--muted);
      }
      .segment button.active {
        background: #fff;
        box-shadow: 0 1px 3px #29371612;
        color: var(--ink);
      }
      .rendered {
        padding: 25px 27px;
        max-width: 800px;
      }
      .rendered .skill-label {
        font: 10px var(--mono);
        color: var(--olive);
        letter-spacing: 1.4px;
        margin-bottom: 14px;
      }
      .rendered h2 {
        font-size: 23px;
        letter-spacing: -0.5px;
        margin-bottom: 10px;
      }
      .rendered > p {
        color: var(--muted);
        font-size: 13px;
        margin: 10px 0 20px;
      }
      .rendered h3 {
        margin: 23px 0 10px;
        font-size: 13px;
      }
      .rendered ul {
        padding-left: 20px;
        font-size: 12px;
        color: #4f5b45;
        line-height: 2;
      }
      .rule {
        display: flex;
        gap: 20px;
        padding: 15px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .rule div {
        flex: 1;
      }
      .rule span {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .rule strong {
        font-size: 21px;
        font-weight: 500;
      }
      .rule strong small {
        font-size: 11px;
        margin-left: 4px;
      }
      .inlinecode {
        padding: 11px 13px;
        background: #f6f8f1;
        border: 1px solid var(--line);
        border-left: 3px solid #9aaa83;
        border-radius: 4px;
        font: 11px/1.8 var(--mono);
        margin-top: 15px;
      }
      .source {
        padding: 14px 0;
        margin: 0;
        overflow: auto;
        background: #fcfdf9;
        font: 12px/1.9 var(--mono);
      }
      .codeline {
        display: flex;
        min-height: 23px;
        white-space: pre;
      }
      .lineno {
        width: 42px;
        flex-shrink: 0;
        text-align: right;
        padding-right: 15px;
        color: #8a9480;
        user-select: none;
      }
      .codetext {
        padding-right: 18px;
        color: #526448;
      }
      .metadata h3 {
        font-size: 12px;
        margin-bottom: 12px;
      }
      .metadata-section {
        padding: 0 0 18px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .metadata-section:last-child {
        border-bottom: 0;
      }
      .metadata dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin: 0;
        font-size: 11px;
      }
      .metadata dt {
        color: var(--muted);
      }
      .metadata dd {
        margin: 0;
        text-align: right;
      }
      .metadata p {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 13px;
      }
      .pointer {
        padding: 10px 0;
        font-size: 12px;
      }
      .pointer .pointerhead {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }
      .pointer small {
        font-size: 11px;
        color: var(--muted);
      }
      .metalink {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
        font-size: 12px;
        color: var(--olive);
      }
      .minipipeline {
        display: flex;
        gap: 5px;
        margin: 13px 0;
      }
      .minipipeline span {
        height: 5px;
        flex: 1;
        background: #9bad84;
        border-radius: 2px;
      }
      .minipipeline.error span:nth-child(n + 3) {
        background: #d2a49c;
      }
      .readmehead {
        padding: 10px 14px;
        background: #f8faf4;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
        font: 11px var(--mono);
      }
      .bottomline {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        margin-top: 18px;
      }
      .bottomline span:last-child {
        margin-left: auto;
      }
      .searchselect {
        position: relative;
      }
      .popup {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 7px;
        box-shadow: 0 8px 28px #26341c20;
        padding: 7px;
        width: 245px;
        z-index: 24;
      }
      .popup button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 9px;
        border-radius: 4px;
        font-size: 12px;
      }
      .popup button:hover {
        background: var(--soft);
      }
      .popup label {
        display: block;
        padding: 7px;
        font-size: 11px;
        color: var(--muted);
      }
      .filter {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #fff;
        color: var(--muted);
        font-size: 12px;
        min-height: 34px;
      }
      .filter select {
        border: 0;
        background: transparent;
        max-width: 150px;
        font-size: 12px;
        outline: none;
      }
      .filter.active {
        background: var(--soft);
        border-color: #bacaa8;
        color: var(--olive);
      }
      .datahead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 17px;
      }
      .deployment-list {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        overflow: hidden;
      }
      .deployrow {
        display: grid;
        grid-template-columns:
          22px minmax(170px, 1.4fr) minmax(160px, 1fr)
          125px 110px 28px;
        gap: 12px;
        align-items: center;
        padding: 18px 17px;
        border-bottom: 1px solid var(--line);
      }
      .deployrow:last-child {
        border-bottom: 0;
      }
      .deployrow:hover {
        background: #fafcf6;
      }
      .deployrow .deplink {
        font: 12px var(--mono);
        font-weight: 600;
        color: #344a23;
      }
      .deployrow .deplink:hover {
        text-decoration: underline;
      }
      .deployrow .title {
        font-size: 12px;
        font-weight: 550;
        margin-bottom: 4px;
      }
      .deployrow small {
        font-size: 11px;
        color: var(--muted);
        display: block;
      }
      .status-circle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #e7efdd;
        color: var(--olive);
        display: grid;
        place-items: center;
      }
      .status-circle svg {
        width: 12px;
        height: 12px;
      }
      .status-circle.failed {
        background: #f6e9e5;
        color: var(--red);
      }
      .tablewrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        white-space: nowrap;
        text-align: left;
      }
      th {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        background: #f7f9f3;
        padding: 10px 15px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 13px 15px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .title-row {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .title-row button {
        font-weight: 550;
        text-align: left;
        padding: 0;
      }
      .title-row button:hover {
        color: var(--olive);
      }
      .asidebox {
        background: #f4f6ee;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 18px;
      }
      .releasehero {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        border-bottom: 1px solid var(--line);
        padding: 20px 0;
        margin-bottom: 20px;
        gap: 20px;
      }
      .releasehero label {
        display: block;
        font-size: 11px;

      function pipelinesPage() {
        let failed = s.run === "failed";
        return `<div class="between datahead"><div class="row"><h2>Pipeline #128</h2>${pill(s.running ? "模拟运行中" : failed ? "Failed" : "Passed", failed ? "red" : s.running ? "amber" : "")}<code class="muted">${repos[s.repo].sha}</code></div><div class="row">${button(failed ? "切换成功示例" : "切换失败示例", "s.run=s.run==='failed'?'success':'failed';s.stage=2;render()", false, "activity")}<button class="btn" ${s.running ? "disabled" : ""} onclick="rerun()">${I("refresh")}${s.running ? "运行中…" : "模拟重新校验"}</button></div></div><div class="box" style="padding:15px 18px;margin-bottom:20px"><div class="row"><span class="avatar">Z</span><span>${repos[s.repo].commit}</span><span class="grow"></span>${tag("main", "branch")}</div><div class="row muted small" style="margin-top:9px">固定提交 <code>${repos[s.repo].sha}</code><span>·</span>由 Git push 触发<span>·</span>示例数据</div></div>${s.running ? '<div class="progress"><div></div></div>' : ""}<div class="stages">${["读取提交", "发现 Skills", "静态校验", "保存制品"].map((t, i) => `<button class="stage ${s.stage === i ? "active" : ""} ${failed && i === 3 ? "disabled" : ""}" onclick="s.stage=${i};render()"><span class="status-circle ${failed && i === 2 ? "failed" : ""}">${I(failed && i === 2 ? "x" : failed && i === 3 ? "clock" : "check")}</span><span>${t}<small>${["source", "discover", "validate", "artifact"][i]}</small></span></button>`).join("")}</div>${failed && s.stage === 2 ? `<div class="notice amber">${I("alert")}<span><strong>SKILL_METADATA</strong> · SKILL.md 缺少 description，未生成新候选版本。</span><button class="link" onclick="s.file='SKILL.md';s.view='source';nav('repo/${s.repo}/files')">定位文件 ${I("arrow")}</button></div>` : ""}<div class="toolbar"><div class="inputwrap">${I("search")}<input aria-label="搜索日志" placeholder="搜索日志…" value="${esc(s.logquery)}" oninput="s.logquery=this.value;updateLogs()"></div><label class="filter">级别<select aria-label="日志级别" onchange="s.loglevel=this.value;updateLogs()"><option value="all" ${s.loglevel === "all" ? "selected" : ""}>全部</option><option value="error" ${s.loglevel === "error" ? "selected" : ""}>Error</option></select></label><div class="right">${button("复制日志", "copyText(logData().map(x=>x.text).join(String.fromCharCode(10)))", false, "copy")}</div></div><div class="console"><div class="consolehead">${I("terminal")}<span class="grow">${["source", "discover", "validate", "artifact"][s.stage]} / ${repos[s.repo].name}</span><span>LOG OUTPUT · DEMO</span></div><div class="logs" id="logs">${logHTML()}</div></div><div class="bottomline"><span>${I("shield")}固定的静态校验步骤，不执行任意脚本。</span><button class="link" onclick="nav('repo/${s.repo}/settings')">查看校验配置 ${I("right")}</button></div>`;
      }
      function logData() {
        const repo = repos[s.repo];
        let sets = [
          [
            "INFO  Resolving repository " + repo.name,
            "INFO  Ref refs/heads/main",
            "INFO  Locked commit " + repo.sha,
            "PASS  Source revision acquired",
          ],
          [
            "INFO  Scan root: " + s.settings[s.repo].root,
            "INFO  Discover skills/" + repo.skill + "/SKILL.md",
            "INFO  Found " +
              (s.repo === "finance" ? 1 : 2) +
              " valid skill roots",
            "PASS  Discovery complete",
          ],
          s.run === "failed"
            ? [
                "INFO  Validator started for commit " + repo.sha,
                "INFO  Checking YAML frontmatter",
                "ERROR SKILL_METADATA: description is required",
                "ERROR skills/" + repo.skill + "/SKILL.md:3",
                "INFO  Artifact step skipped; no candidate produced",
              ]
            : [
                "INFO  Validator started for commit " + repo.sha,
                "PASS  YAML frontmatter: name, description",
                "PASS  Reference boundaries and file sizes",
                "PASS  No credential patterns detected",
                "PASS  Static validation complete",
              ],
          s.run === "failed"
            ? ["INFO  Skipped: validation failed"]
            : [
                "INFO  Computing content-addressed object digests",
                "INFO  Saving immutable version " + repo.sha,
                "PASS  Candidate version available",
                "INFO  Channel pointers unchanged",
              ],
        ];
        return sets[s.stage].map((text, i) => ({
          time: "14:32:" + String(10 + i).padStart(2, "0"),
          text,
          level: text.startsWith("ERROR") ? "error" : "info",
        }));
      }
      function logHTML() {
        const list = logData().filter(
          (l) =>
            l.text.toLowerCase().includes(s.logquery.toLowerCase()) &&
            (s.loglevel === "all" || l.level === s.loglevel),
        );
        return list.length
          ? list
              .map(
                (l) =>
                  `<div class="logline ${l.level === "error" ? "error" : ""}"><span class="time">${l.time}</span><span class="${l.text.startsWith("PASS") ? "ok" : ""}">${esc(l.text)}</span></div>`,
              )
              .join("")
          : '<div class="empty">没有匹配的日志行</div>';
      }
      function updateLogs() {
        document.getElementById("logs").innerHTML = logHTML();
      }
      function rerun() {
        if (s.running) return;
        s.running = true;
        render();
        const timer = setTimeout(() => {
          s.running = false;
          s.events.unshift("模拟重新校验 " + repos[s.repo].name);
          render();
          notify("模拟校验完成，真实仓库未改变");
        }, 700);
        transientTimers.push(timer);
      }
      function settingsPage() {
        const cfg = s.settings[s.repo];
        return `<div class="workgrid"><section><div class="datahead"><h2>仓库配置</h2><span class="muted small">仅原型内生效</span></div><div class="box"><div class="formrow"><div><label for="reponame">仓库名称</label><small>当前查看的内容来源</small></div><input id="reponame" class="textinput" value="${repos[s.repo].name}" readonly></div><div class="formrow"><div><label for="skillroot">Skill 根目录</label><small>相对于仓库根目录，例如 skills</small></div><div><input id="skillroot" class="textinput" value="${esc(cfg.root)}" aria-describedby="rooterror"><p id="rooterror" class="inlineerror" role="alert"></p></div></div><div class="formrow"><div><label>默认分支</label><small>首次同步与默认浏览引用</small></div>${tag("main", "branch")}</div><div class="formrow"><div><label>组织安全策略</label><small>此规则对整个组织生效，不是仓库覆盖项</small></div>${pill("禁止脚本分发", "gray")}</div><div style="padding:15px 20px;display:flex;justify-content:flex-end">${button("保存仓库配置", "saveRepoSettings()", true)}</div></div><p class="tooltip">组织安全策略及 .skills-platform.yaml 保持现有优先级；这里只演示仓库根目录设置。</p></section><aside class="asidebox" style="height:fit-content"><h3>配置影响范围</h3><p class="small muted" style="margin:12px 0">更改根目录会影响后续扫描，不会改写已发布快照。</p><button class="link" onclick="s.file='.skills-platform.yaml';s.view='source';nav('repo/${s.repo}/files')">查看配置文件 ${I("up")}</button></aside></div>`;
      }
      function saveRepoSettings() {
        let root = document.getElementById("skillroot").value.trim();
        let err = document.getElementById("rooterror");
        if (!root || root.startsWith("/") || root.split("/").includes("..")) {
          err.textContent = "请输入有效的仓库相对路径，不可包含 ..";
          document
            .getElementById("skillroot")
            .setAttribute("aria-invalid", "true");
          document.getElementById("skillroot").focus();
          return;
        }
        s.settings[s.repo].root = root;
        s.events.unshift("更新仓库根目录 " + repos[s.repo].name + " → " + root);
        err.textContent = "";
        document.getElementById("skillroot").removeAttribute("aria-invalid");
        notify("已保存原型配置（模拟），后续扫描入口使用 " + root);
      }
      function agentsPage() {
        return (
          pageHeader(
            "Agent 接入",
            "授权目标、固定模式与操作指引。在这里检查交付范围。",
            button("接入客户端", "agentSetup()", true, "plus"),
          ) +
          `<div class="body"><div class="notice amber">${I("lock")}finance-batch 固定在 #023，渠道更新不会改变当前任务的内容。</div><div class="box tablewrap"><table><thead><tr><th>客户端 / Profile</th><th>渠道</th><th>模式</th><th>目标快照</th><th>授权</th><th>操作</th></tr></thead><tbody>${[
            ["finance-agent", "finance-canary", "Canary", "dynamic", s.canary],
            [
              "developer-agent",
              "engineering-stable",
              "Stable",
              "dynamic",
              s.stable,
            ],
            ["finance-batch", "finance-pinned", "Stable", "pinned", 23],
          ]
            .map(
              (a) =>
                `<tr><td><div class="title-row">${I("agent")}<strong>${a[0]}</strong></div><small style="margin-left:25px">${a[1]}</small></td><td>${a[2]}</td><td>${pill(a[3], a[3] === "pinned" ? "amber" : "gray")}</td><td><a class="link mono" href="#release/${a[4]}">#0${a[4]}</a></td><td>${pill("已授权")}</td><td><button class="link" onclick="agentInspect('${a[0]}','${a[3]}',${a[4]})">检查挂载 ${I("terminal")}</button></td></tr>`,
            )
            .join(
              "",
            )}</tbody></table></div><p class="tooltip">目标快照来自渠道 / Profile 配置，不等于实际挂载报告。原型不展示虚构的在线状态或 Agent 生效状态。</p></div>`
        );
      }
      function auditRows() {
        const rows = s.events.length
          ? s.events
          : ["创建基线快照 #023", "推进 Stable → #023 · 初始规则验证通过"];
        return `<div class="box">${rows.map((e, i) => `<div class="auditline"><span class="status-circle">${I("check")}</span><div>${esc(e)}<small>Haixin Zhou · ${s.events.length ? "本次模拟操作" : "示例历史"}</small></div><code class="muted">event_${String(rows.length - i).padStart(3, "0")}</code></div>`).join("")}</div>`;
      }
      function auditPage() {
        return (
          pageHeader(
            "审计记录",
            "追溯快照、渠道与配置的操作原因。",
            button("重置演示", "reset()", false, "refresh"),
          ) + `<div class="body">${auditRows()}</div>`
        );
      }
      async function copyText(text) {
        try {
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
            notify("已复制");
          } else throw Error();
        } catch {
          showModal(
            "复制内容",
            `<p>浏览器未允许直接写入剪贴板，可选择下面的内容复制。</p><textarea readonly aria-label="待复制内容">${esc(text)}</textarea>`,
          );
          document.querySelector("#modalbody textarea").select();
        }
      }
      function cloneRepo() {
        const commandText =
          "git clone https://skiva.example.com/git/linghe/" +
          repos[s.repo].name +
          ".git";
        showModal(
          "克隆 " + repos[s.repo].name,
          `<p>示例地址。正式使用请复制真实部署地址，并使用具有仓库权限的 PAT。</p><div class="inlinecode" style="overflow-wrap:anywhere">${commandText}</div><p style="margin-top:14px">凭据通过 Git credential helper 保存，不应放进仓库 URL。</p>`,
          button("关闭", "closeModal()") +
            button("复制示例命令", `copyText('${commandText}')`, true, "copy"),
        );
      }
      function commitHistory() {
        showModal(
          "提交历史 · " + repos[s.repo].name,
          `<p>选择版本对照文件内容，保持当前仓库上下文。</p><div class="box">${[
            [repos[s.repo].sha, repos[s.repo].commit, "main"],
            ["61b3e20", "上一版规则", "release/2026-10"],
          ]
            .map(
              (c) =>
                `<button class="selectionrow" style="width:100%;text-align:left" onclick="s.branch='${c[2]}';closeModal();render()"><span class="grow">${c[1]}</span><code>${c[0]}</code>${I("right")}</button>`,
            )
            .join("")}</div>`,
        );
      }
      function iCommit(i) {
        s.branch = i ? "release/2026-10" : "main";
        nav("repo/" + s.repo + "/files");
      }
      function fileFinder() {
        command();
        document.getElementById("commandquery").value = "文件";
        commands("文件");
      }
      function connectRepo() {
        showModal(
          "接入仓库",
          `<p>选择内容来源。下列卡片切换对应示例仓库。</p><button class="selectionrow box" style="width:100%;text-align:left;margin-bottom:12px" onclick="closeModal();nav('repo/finance/files')">${I("repo")}<div class="grow"><strong>平台托管</strong><small>命名空间、仓库路径、模板 → Git clone / push</small></div>${I("right")}</button><button class="selectionrow box" style="width:100%;text-align:left" onclick="closeModal();nav('repo/developer/files')">${I("git")}<div class="grow"><strong>外部 Git</strong><small>远程 URL、凭据引用、分支 → 同步</small></div>${I("right")}</button><p style="margin-top:15px">当前是模式与入口原型，未创建真实仓库。</p>`,
        );
      }
      function agentSetup() {
        showModal(
          "连接 Agent",
          `<p>1. 创建 Profile，选择渠道、Skills 与一致性模式。<br>2. 注册客户端，保存只展示一次的 Token。<br>3. 挂载后让 Agent 从该目录加载 Skills。</p><div class="inlinecode">skills-mount mount<br>  --server https://skiva.example.com<br>  --profile &lt;PROFILE_ID&gt;<br>  --token-file ./client.token<br>  --path ./agent-skills</div><p style="margin-top:14px">以上为参数示意，原型不创建令牌或执行命令。</p>`,
        );
      }
      function agentInspect(name, mode, snap) {
        let cmd =
          mode === "pinned"
            ? "skills-mount status\n# 任务结束后，确认服务端绑定再执行\nskills-mount refresh --repin"
            : "skills-mount status\nskills-mount refresh\n# 重新加载 Skill 或开启新任务";
        showModal(
          name,
          `<div class="notice ${mode === "pinned" ? "amber" : ""}">${I(mode === "pinned" ? "lock" : "refresh")}${mode} · 目标 #0${snap}</div><p>${mode === "pinned" ? "保持任务快照；仅在任务边界重新固定。" : "跟随渠道更新，但 Agent 已加载的上下文可能需要重新加载。"}</p><pre class="inlinecode" style="white-space:pre-wrap">${esc(cmd)}</pre><p style="margin-top:14px">实际挂载报告：未获取。请在终端核对。</p>`,
          button("关闭", "closeModal()") +
            `<button class="btn primary" onclick="copyText(${esc(JSON.stringify(cmd))})">${I("copy")}复制命令</button>`,
        );
      }
      function help() {
        showModal(
          "原型 02 · 开发工具工作台",
          `<p>所有数据均为模拟。可直接打开 HTML；浏览器前进 / 后退可切换页面。</p><div class="box"><div class="selectionrow"><strong>01</strong><div><strong>浏览内容</strong><small>分支选择 → 文件树 → 预览 / 源码 → 复制内容</small></div></div><div class="selectionrow"><strong>02</strong><div><strong>检查构建</strong><small>流水线阶段 → 搜索日志 → 切换失败示例 → 定位文件</small></div></div><div class="selectionrow"><strong>03</strong><div><strong>交付变更</strong><small>准备发布 → 同屏差异 → 快照 → Canary → 验证 → Stable</small></div></div></div><p style="margin-top:16px">⌘ / Ctrl K 搜索页面与文件；Esc 关闭面板。发布仍是组织级集合，仓库只是工作上下文。</p><p>交互参考：<a class="link" href="https://docs.gitlab.com/user/project/repository/files/file_tree_browser/" target="_blank" rel="noopener">GitLab 文件树</a> · <a class="link" href="https://vercel.com/docs/deployments/managing-deployments" target="_blank" rel="noopener">Vercel 部署管理</a></p>`,
          button("继续使用", "closeModal()", true),
        );
      }
      function allCommands() {
        return [
          {
            title: "仓库 · finance-skills",
            sub: "浏览文件",
            icon: "repo",
            run: () => nav("repo/finance/files"),
          },
          {
            title: "仓库 · developer-skills",
            sub: "浏览文件",
            icon: "repo",
            run: () => nav("repo/developer/files"),
          },
          {
            title: "发布 · 组织快照",
            sub: "筛选发布记录",
            icon: "layers",
            run: () => nav("releases"),
          },
          {
            title: "流水线 · 当前仓库",
            sub: "阶段与日志",
            icon: "activity",
            run: () => nav("repo/" + s.repo + "/pipelines"),
          },
          {
            title: "Agent 接入",
            sub: "授权与目标快照",
            icon: "agent",
            run: () => nav("agents"),
          },
          {
            title: "创建发布快照",
            sub: "完整集合与差异",
            icon: "plus",
            run: () => openComposer(),
          },
          ...repos[s.repo].files.map((f) => ({
            title: "文件 · " + f,
            sub: repos[s.repo].name,
            icon: "file",
            run: () => {
              s.file = f;
              s.view = f === "SKILL.md" ? "preview" : "source";
              nav("repo/" + s.repo + "/files");
            },
          })),
        ];
      }
      function command() {
        if (s.drawer) closeDrawer();
        let el = document.getElementById("command");
        document.getElementById("commandquery").value = "";
        commands("");
        el.showModal();
        document.getElementById("commandquery").focus();
      }
      function commands(q) {
        cmdItems = allCommands().filter((c) =>
          (c.title + " " + c.sub).toLowerCase().includes(q.toLowerCase()),
        );
        cmdIndex = 0;
        drawCommands();
      }
      function drawCommands() {
        document.getElementById("commandresults").innerHTML = cmdItems.length
          ? cmdItems
              .map(
                (c, i) =>
                  `<button class="commandrow ${i === cmdIndex ? "selected" : ""}" onclick="executeCommand(${i})">${I(c.icon)}<span class="grow">${c.title}<small class="muted" style="display:block;font-size:11px">${c.sub}</small></span>${i === cmdIndex ? "<kbd>↵</kbd>" : ""}</button>`,
              )
              .join("")
          : '<div class="empty">没有匹配的命令或文件</div>';
      }
      function executeCommand(i) {
        const c = cmdItems[i];
        if (!c) return;
        document.getElementById("command").close();
        c.run();
      }
      document.getElementById("command").addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          cmdIndex = Math.max(
            0,
            Math.min(
              cmdItems.length - 1,
              cmdIndex + (e.key === "ArrowDown" ? 1 : -1),
            ),
          );
          drawCommands();
          document
            .querySelector(".commandrow.selected")
            ?.scrollIntoView({ block: "nearest" });
        }
        if (e.key === "Enter") {
          e.preventDefault();
          executeCommand(cmdIndex);
        }
      });
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          if (
            !document.getElementById("modal").open &&
            !document.getElementById("command").open
          )
            command();
        }
        if (e.key === "Escape") {
          if (s.drawer) closeDrawer();
          mobile(false);
          if (s.popup) {
            s.popup = "";
            render();
          }
        }
        if (s.drawer && e.key === "Tab") {
          const elements = [
            ...document.querySelectorAll(
              ".drawer button:not(:disabled),.drawer input,.drawer select",
            ),
          ];
          const first = elements[0],
            last = elements.at(-1);
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });
      window.addEventListener("hashchange", () => {
        closePopup();
        mobile(false);
        if (s.drawer) closeDrawer();
        render();
        window.scrollTo(0, 0);
      });
      document.addEventListener("click", (e) => {
        if (s.popup && !e.target.closest(".searchselect")) {
          s.popup = "";
          render();
        }
      });
      for (const [id, ico] of [
        ["menui", "menu"],
        ["brandi", "layers"],
        ["chevi", "chev"],
        ["searchi", "search"],
        ["helpi", "help"],
        ["cmdi", "search"],
      ])
        document.getElementById(id).innerHTML = I(ico);
      document.getElementById("helpnav").innerHTML = I("help") + "使用指引";
      document.getElementById("resetnav").innerHTML = I("refresh") + "重置演示";
      render();
    </script>
  </body>
</html>
