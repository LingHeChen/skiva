name: Deploy documentation
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/build-docs.mjs'
      - '.github/workflows/pages.yml'
      - 'tests/pages/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --prefix apps/web
      - run: npm run build:docs --prefix apps/web
        env:
          SKIVA_DOCS_BASE_PATH: /skiva
      - run: cd apps/web && npx playwright install --with-deps chrome
      - run: npm run test:docs --prefix apps/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
