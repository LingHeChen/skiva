name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: skiva, POSTGRES_PASSWORD: skiva-dev, POSTGRES_DB: skiva}
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U skiva" --health-interval 3s --health-retries 20
    env:
      GOTOOLCHAIN: go1.26.10
      SKIVA_ADMIN_PASSWORD: local-skiva-development-2026
      SKIVA_MANAGED_GIT_ENABLED: 'true'
      SKIVA_MANAGED_GIT_WRITE_ENABLED: 'true'
      SKIVA_MANAGED_GIT_AUTO_CI_ENABLED: 'true'
      SKIVA_GIT_ALLOW_LOOPBACK_HTTP: 'true'
      SKIVA_GIT_PUBLIC_URL: http://localhost:8080
      SKIVA_WEB_ORIGIN: http://localhost:3001
      SKIVA_TEST_DATABASE_URL: postgres://skiva:skiva-dev@localhost:55432/skiva?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: |
          PGPASSWORD=skiva-dev createdb -h localhost -p 55432 -U skiva skiva_test
          make DATABASE_URL='postgres://skiva:skiva-dev@localhost:55432/skiva_test?sslmode=disable' migrate-up
          make deps migrate-up lint test build
      - run: make openapi-generate sqlc-generate && git diff --exit-code -- packages/openapi apps/server/internal/db
      - run: SKIVA_DB_PASSWORD=compose-validation-only docker compose config --quiet
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./apps/server/... ./apps/mount/... ./packages/...
      - run: npm audit --prefix apps/web --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: cd apps/web && npx playwright install --with-deps chrome
      - run: |
          bin/skiva-server > /tmp/skiva-server.log 2>&1 &
          npm run dev --prefix apps/web -- --port 3001 > /tmp/skiva-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/login >/dev/null && break || sleep 1; done
          make test-e2e
      - run: docker build -f deployments/docker/server.Dockerfile -t skiva-server:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: evidence, path: test-results}
