name: skiva
services:
  postgres:
    image: postgres:17
    container_name: skiva-postgres
    environment:
      POSTGRES_DB: skiva
      POSTGRES_USER: skiva
      POSTGRES_PASSWORD: ${SKIVA_DB_PASSWORD:-skiva-dev}
    ports: ['127.0.0.1:55432:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skiva']
      interval: 3s
      retries: 20
  server:
    profiles: [full]
    build:
      context: ..
      dockerfile: deployments/docker/server.Dockerfile
    environment:
      SKIVA_ENV: ${SKIVA_ENV:-local}
      SKIVA_OIDC_ISSUER: ${SKIVA_OIDC_ISSUER:-}
      SKIVA_OIDC_CLIENT_ID: ${SKIVA_OIDC_CLIENT_ID:-}
      SKIVA_OIDC_CLIENT_SECRET: ${SKIVA_OIDC_CLIENT_SECRET:-}
      SKIVA_DATABASE_URL: postgres://skiva:${SKIVA_DB_PASSWORD:-skiva-dev}@postgres:5432/skiva?sslmode=disable
      SKIVA_ADMIN_PASSWORD: ${SKIVA_ADMIN_PASSWORD:-}
      SKIVA_ADMIN_EMAIL: ${SKIVA_ADMIN_EMAIL:-admin@localhost}
      SKIVA_LISTEN: 0.0.0.0:8080
      SKIVA_DATA_DIR: /data
      SKIVA_WEB_ORIGIN: ${SKIVA_WEB_ORIGIN:-http://localhost:3000}
      SKIVA_GIT_ALLOWLIST: ${SKIVA_GIT_ALLOWLIST:-}
    ports: ['127.0.0.1:8080:8080']
    volumes: [artifacts:/data]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  web:
    profiles: [full]
    build:
      context: ..
      dockerfile: deployments/docker/web.Dockerfile
      args:
        SKIVA_API_URL: http://server:8080
    ports: ['127.0.0.1:3000:3000']
    depends_on: [server]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres:
  artifacts:
