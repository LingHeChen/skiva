name: skiva-pilot
x-server: &server
  image: ${SKIVA_SERVER_IMAGE:?Set immutable server image tag or digest}
  environment: &environment
    SKIVA_ENV: production
    SKIVA_DATABASE_URL_FILE: /run/secrets/database_url
    SKIVA_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_password
    SKIVA_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_secret
    SKIVA_ADMIN_EMAIL: ${SKIVA_ADMIN_EMAIL:?Set IdP verified administrator email}
    SKIVA_OIDC_ISSUER: ${SKIVA_OIDC_ISSUER:?Set HTTPS OIDC issuer}
    SKIVA_OIDC_CLIENT_ID: ${SKIVA_OIDC_CLIENT_ID:?Set OIDC client ID}
    SKIVA_LISTEN: 0.0.0.0:8080
    SKIVA_DATA_DIR: /data
    SKIVA_WEB_ORIGIN: https://${SKIVA_DOMAIN:?Set domain}
    SKIVA_GIT_PUBLIC_URL: https://${SKIVA_DOMAIN}
    SKIVA_GIT_TRUST_PROXY: 'true'
    SKIVA_MANAGED_GIT_ENABLED: ${SKIVA_MANAGED_GIT_ENABLED:-false}
    SKIVA_MANAGED_GIT_WRITE_ENABLED: ${SKIVA_MANAGED_GIT_WRITE_ENABLED:-false}
    SKIVA_MANAGED_GIT_AUTO_CI_ENABLED: ${SKIVA_MANAGED_GIT_AUTO_CI_ENABLED:-false}
    SKIVA_GIT_ALLOWLIST: ${SKIVA_GIT_ALLOWLIST:-}
  secrets: [database_url, bootstrap_password, oidc_secret]
  volumes: [artifacts:/data]
  networks: [backend]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp:size=128m,mode=1777]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '5'}
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: skiva
      POSTGRES_DB: skiva
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U skiva -d skiva']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *server
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  server:
    <<: *server
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, skiva-server, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 150s
    restart: unless-stopped
  web:
    image: ${SKIVA_WEB_IMAGE:?Set immutable web image tag or digest}
    networks: [backend]
    depends_on:
      server: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      SKIVA_DOMAIN: ${SKIVA_DOMAIN}
      SKIVA_ACME_EMAIL: ${SKIVA_ACME_EMAIL:?Set ACME contact email}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    depends_on:
      server: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus-alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [backend]
    restart: unless-stopped
networks:
  backend:
volumes:
  postgres:
  artifacts:
  caddy-data:
  caddy-config:
  prometheus:
secrets:
  db_password:
    file: ${SKIVA_SECRETS_DIR:?Set absolute secrets directory}/db_password
  database_url:
    file: ${SKIVA_SECRETS_DIR}/database_url
  bootstrap_password:
    file: ${SKIVA_SECRETS_DIR}/bootstrap_password
  oidc_secret:
    file: ${SKIVA_SECRETS_DIR}/oidc_secret
